[project]
name = "ravintopolku-palvelin"
version = "0.1.0"
description = "Ravintopolun synkronointipalvelin työasemalle (aiops ADR-0016)"
requires-python = ">=3.12"
dependencies = ["starlette>=0.40", "uvicorn>=0.30"]

[project.scripts]
ravintopolku-palvelin = "ravintopolku_palvelin.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ravintopolku_palvelin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
